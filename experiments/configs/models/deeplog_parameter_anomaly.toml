name = "deeplog_parameter_anomaly"
detector = "deeplog"
parameter_detection_enabled = true
key_detection_enabled = false
history_size = 3
hidden_size = 256
num_layers = 1
include_elapsed_time = true
validation_fraction = 0.2
parameter_ci_highlight_templates = [
  "VM Started (Lifecycle Event)",
  "VM Paused (Lifecycle Event)",
  "During sync_power_state the instance has a pending task (spawning). Skip.",
  "Took NUM seconds to build instance.",
]
description = "Parameter-only DeepLog configuration for the OpenStack Figure 9 approximation using an explicit h=3, L=1, alpha=256 approximation."
