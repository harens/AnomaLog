[experiments.bgl_entity_chronological]
dataset = "bgl/entity_chronological"
# Entity-chronological runs compare DeepCASE against the shared sanity baselines.
models = [
  "template_frequency_default",
  "naive_bayes_default",
  "markov_default",
  "deepcase",
]

[experiments.hdfs_v1_entity_chronological]
dataset = "hdfs/v1_entity_chronological"
# Entity-chronological runs compare DeepCASE against the shared sanity baselines.
models = [
  "template_frequency_default",
  "naive_bayes_default",
  "markov_default",
  "deepcase",
]

[experiments.openstack_deeplog_preprocessed]
dataset = "openstack/deeplog_preprocessed"
# OpenStack is the paper's other DeepLog-style setting: a sessionised stream
# with host identifiers, metric values, and a normal-only training prefix.
# Naive Bayes is omitted because the train split is single-class.
models = [
  "deeplog_default",
  "template_frequency_default",
  "markov_default",
  "deepcase",
]

[experiments.openstack_deeplog_preprocessed.overrides.deeplog_default]

[experiments.thunderbird]
dataset = "thunderbird"
# Thunderbird follows the benchmark slice used by the public LogLLM/DeepLog
# family: the canonical Thunderbird.log file, a 10-million-line range starting
# at line 160,000,000, and 100-log chronological windows. We keep all
# benchmarked models together so the registry exposes one public Thunderbird
# experiment.
models = [
  "deeplog_default",
  "deepcase",
  "template_frequency_default",
  "naive_bayes_default",
  "markov_default",
]

[experiments.ait_ads]
dataset = "ait_ads/base"
# AIT-ADS is a single continuous alert chronology, so it keeps the
# stream-oriented baselines.
models = [
  "template_frequency_default",
  "markov_default",
]

[experiments.ait_ads_entity]
dataset = "ait_ads/entity_chronological"
# DeepLog and DeepCASE both need entity-local sequences, so they run against
# the same AIT-ADS source but with entity grouping instead of the global
# stream view.
models = [
  "deeplog_default",
  "deepcase",
]

[experiment_sets.bgl_deeplog_paper]
# DeepLog paper reproduction: the LSTM next-event target plus the three simple
# floors that tell us whether the dataset is separable before the neural model
# does anything interesting.
# Naive Bayes is omitted because the paper's BGL training prefix is
# single-class.
models = [
  "deeplog_default",
  "template_frequency_default",
  "markov_default",
]
datasets = [
  "bgl/deeplog_paper_1pct_normal_entry_stream_no_online",
  "bgl/deeplog_paper_10pct_entry_stream_no_online",
]

[experiment_sets.bgl_deeplog_paper.overrides.deeplog_default]
"model.history_size" = 3
"model.top_g_values" = [1, 3, 6]
"model.num_layers" = 1
"model.hidden_size" = 256
"model.primary_metric_scope" = "event_level_detection"
"model.secondary_metric_scopes" = ["next_event_prediction", "sequence_level_detection"]

[experiment_sets.hdfs_deeplog_paper]
# DeepLog paper reproduction: the HDFS runs that preserve the original
# normal-only training contract, plus the lightweight baselines that probe
# how much of the signal comes from template statistics or local ordering.
models = [
  "deeplog_default",
  "deepcase",
  "template_frequency_default",
  "markov_default",
]
datasets = [
  "hdfs/v1_deeplog_paper_entry100k_split_partial",
  "hdfs/v1_deeplog_paper_entry100k_assign_first",
  "hdfs/wuyifan18_deeplog_preprocessed",
]

[experiment_sets.hdfs_deeplog_paper.overrides.deeplog_default]
"model.top_g_values" = [1, 3, 5, 7, 9]
