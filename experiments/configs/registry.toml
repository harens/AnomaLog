[model_sets.baselines_with_nb]
models = [
  "template_frequency_default",
  "naive_bayes_default",
  "markov_default",
]

[model_sets.baselines_no_nb]
models = [
  "template_frequency_default",
  "markov_default",
]

[model_sets.deepcase_majority_vote]
models = ["deepcase"]

[model_sets.deepcase_majority_vote.overrides.deepcase]
"model.name" = "deepcase_majority_vote"
"model.cluster_score_strategy" = "majority_vote"

[model_sets.deepcase_threshold_fraction]
models = ["deepcase"]

[model_sets.deepcase_threshold_fraction.overrides.deepcase]
"model.name" = "deepcase_threshold_fraction"
"model.cluster_score_strategy" = "threshold_fraction"
"model.cluster_anomaly_fraction_threshold" = 0.75

[model_sets.deepcase_abstain_mixed]
models = ["deepcase"]

[model_sets.deepcase_abstain_mixed.overrides.deepcase]
"model.name" = "deepcase_abstain_mixed"
"model.cluster_score_strategy" = "abstain_mixed"

[model_sets.deeplog_short_session_padding_fidelity]
models = ["deeplog_default"]

[model_sets.deeplog_short_session_padding_fidelity.overrides.deeplog_default]
"model.short_session_padding_fidelity" = true

[experiments.bgl_entity_chronological]
dataset = "bgl/entity_chronological"
# AnomaLog benchmark extension, not a DeepLog or DeepCASE paper protocol.
# Uses entity-local chronological grouping to expose sequence-level and
# event-level benchmarking on BGL with true line-level labels.
# Useful for regression tracking and workload-reduction experiments because
# BGL provides event labels directly, avoiding parent-sequence label smearing.
model_sets = [
  "baselines_with_nb",
  "deepcase_majority_vote",
  "deepcase_threshold_fraction",
  "deepcase_abstain_mixed",
]
models = [
  "deepcase",
  "deeplog_default",
]

[experiments.hdfs_v1_entity_chronological]
dataset = "hdfs/v1_entity_chronological"
# Generic entity-grouped HDFS benchmark used for local comparisons and
# regression tracking. This is not the original DeepLog paper split.
# Sessions are grouped by block identifier and evaluated chronologically,
# but the split semantics differ from the paper's first-100k protocol and
# from the historical wuyifan18 benchmark archive.
model_sets = ["baselines_with_nb"]
models = [
  "deepcase",
  "deeplog_default",
]

[experiments.openstack_deeplog_preprocessed]
dataset = "openstack/deeplog_preprocessed"
# Best-effort DeepLog OpenStack reproduction using instance_id session grouping.
# Rows without recoverable instance identifiers are excluded to preserve the
# paper-facing session semantics.
# Template mining strips volatile identifiers (UUIDs, IPs, paths, instance
# filenames, numeric tokens) before Spell parsing to avoid vocabulary leakage.
# The local LogHub-derived corpus does not currently reproduce the paper's
# reported counts or template inventory exactly.
model_sets = ["baselines_no_nb"]
models = [
  "deeplog_default",
  "deepcase",
]

[experiments.openstack_deeplog_figure9_parameter_ci_approx]
dataset = "openstack/deeplog_parameter_ci_approx"
description = "Parameter-only DeepLog OpenStack approximation of Figure 9 that preserves raw numeric parameters, keeps VM-instance grouping, and carries parameter history across adjacent instances."
models = ["deeplog_parameter_anomaly"]

[experiments.thunderbird]
dataset = "thunderbird"
# Thunderbird benchmark reproduction targeting the later public 100-log-window
# Thunderbird protocol used by ICSE-2022-style evaluations rather than the
# original DeepLog paper.
# Uses the canonical Thunderbird.log archive and the public
# 160M-170M contiguous line slice.
# Windows are fixed-size chronological 100-log sequences with alert-token
# labels preserved from the raw corpus.
model_sets = ["baselines_with_nb"]
models = ["deeplog_default"]

[experiments.thunderbird_entity_chronological]
dataset = "thunderbird/entity_chronological"
# Entity-local Thunderbird benchmark extension for DeepCASE and shared
# baselines. This is not a paper-faithful DeepLog Thunderbird protocol.
# Unlike the reproduction benchmark, this configuration uses entity grouping
# rather than fixed 100-log chronological windows.
model_sets = [
  "baselines_with_nb",
  "deepcase_majority_vote",
  "deepcase_threshold_fraction",
  "deepcase_abstain_mixed",
]
models = [
  "deepcase",
  "deeplog_default",
]

[experiments.ait_ads]
dataset = "ait_ads/base"
# AIT-ADS combined chronological alert-stream benchmark.
# Follows the AACT-style combined multi-scenario chronology rather than
# per-scenario evaluation.
# Alerts from all scenarios are merged globally by timestamp and evaluated as
# a continuous alert stream.
# Alert-level metrics are the intended reporting unit.
model_sets = ["baselines_no_nb"]
models = ["deeplog_default"]

[experiments.ait_ads_entity]
dataset = "ait_ads/entity_chronological"
# Entity-local AIT-ADS configuration for DeepCASE-style contextual modelling.
# Chronological splitting is applied before entity grouping to preserve the
# paper-facing temporal evaluation semantics.
# Included as a best-effort approximation of the AACT/DeepCASE-style workflow;
# the original paper uses time-series cross-validation rather than a simple
# holdout split.
model_sets = ["baselines_no_nb"]
models = [
  "deeplog_default",
  "deepcase",
]

[experiment_sets.bgl_deeplog_ccs2017_paper]
# Best-effort reproduction of the DeepLog CCS 2017 BGL normal-entry protocol.
# Uses a chronological raw-entry stream with split-before-grouping semantics.
# Only normal target events before the cutoff are eligible for training.
# Event-level metrics are the paper-facing metrics; sequence metrics are
# retained only as diagnostics.
model_sets = ["baselines_no_nb"]
models = ["deeplog_default"]
datasets = [
  "bgl/bgl_deeplog_ccs2017_paper_1pct_normal_entry_stream_no_online",
  "bgl/bgl_deeplog_ccs2017_paper_10pct_entry_stream_no_online",
]

[experiment_sets.bgl_deeplog_ccs2017_paper.overrides.deeplog_default]
"model.history_size" = 3
"model.top_g_values" = [1, 3, 6]
"model.num_layers" = 1
"model.hidden_size" = 256
"model.primary_metric_scope" = "event_level_detection"
"model.secondary_metric_scopes" = ["next_event_prediction", "sequence_level_detection"]

[experiment_sets.bgl_how_far_are_we_2022]
# Later DeepLog BGL benchmark protocol from "How Far Are We?".
# This path uses fixed one-hour time windows with a raw-entry split applied
# before grouping and straddling windows dropped, matching the benchmark's
# chronological BGL recipe rather than the CCS 2017 raw-entry stream. The
# top-g candidate setting is left at the model default pending a separate
# benchmark-specific confirmation.
model_sets = ["baselines_no_nb"]
models = ["deeplog_default"]
datasets = ["bgl/how_far_are_we_2022"]

[experiment_sets.bgl_how_far_are_we_2022.overrides.deeplog_default]
"model.history_size" = 10

[experiment_sets.hdfs_deeplog_paper]
# Best-effort reconstruction of the DeepLog HDFS first-100k protocol using
# current LogHub-derived data.
# Training is normal-only and uses key-only DeepLog scoring with the paper
# top-g configuration.
# The current LogHub corpus does not exactly reproduce the original paper
# counts or transition distribution.
model_sets = ["baselines_no_nb", "deeplog_short_session_padding_fidelity"]
models = ["deeplog_default", "deepcase"]
datasets = [
  # Sessions are assigned to train/test according to the first event crossing
  # the raw-entry cutoff boundary.
  "hdfs/v1_deeplog_paper_entry100k_split_partial",
  # Sessions crossing the split boundary are partitioned rather than assigned
  # wholesale.
  # Included as a protocol-sensitivity audit because the DeepLog paper does not
  # fully specify straddling-session behaviour.
  # Retained for reproducibility analysis rather than as the preferred paper view.
  "hdfs/v1_deeplog_paper_entry100k_assign_first",
  # Reproduction target for the widely reused wuyifan18 preprocessed DeepLog
  # HDFS benchmark archive.
  # Uses the packaged hdfs_train / hdfs_test_normal / hdfs_test_abnormal files
  # directly rather than reconstructing sessions from raw LogHub logs.
  # Preserves the original duplicate-weighted benchmark evaluation semantics.
  "hdfs/wuyifan18_deeplog_preprocessed",
]

[experiment_sets.hdfs_deeplog_paper.overrides.deeplog_default]
"model.top_g_values" = [1, 3, 5, 7, 9]

[experiment_sets.hdfs_deeplog_paper_drain3_ablation]
# Drain3 ablation for the HDFS DeepLog paper matrix.
# Mirrors the paper-facing registry entries that use Spell, but swaps the
# template parser to Drain3 so the parser choice can be compared directly.
model_sets = ["baselines_no_nb", "deeplog_short_session_padding_fidelity"]
models = ["deeplog_default", "deepcase"]
datasets = [
  "hdfs/v1_deeplog_paper_entry100k_split_partial_drain3",
  "hdfs/v1_deeplog_paper_entry100k_assign_first_drain3",
]

[experiment_sets.hdfs_deeplog_paper_drain3_ablation.overrides.deeplog_default]
"model.top_g_values" = [1, 3, 5, 7, 9]

[experiment_sets.hdfs_deepcase_table_iv_compat]
# DeepCASE Table-IV compatibility configuration.
# Mirrors the paper's next-event prediction framing rather than DeepLog-style
# sequence anomaly detection.
# Uses only hdfs_test_normal with a chronological 20/80 train/evaluation split.
# Intended for weighted top-1 next-event comparison against the published
# DeepCASE HDFS prediction results.
model_sets = ["baselines_no_nb"]
models = ["deepcase", "deeplog_default"]
datasets = ["hdfs/wuyifan18_deepcase_table_iv_compat"]

[experiment_sets.hdfs_deepcase_table_iv_compat.overrides.deepcase]
"model.primary_metric_scope" = "next_event_prediction"
