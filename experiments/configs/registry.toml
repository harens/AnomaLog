[model_sets.baselines_with_nb]
models = [
  "template_frequency_default",
  "naive_bayes_default",
  "markov_default",
]

[model_sets.baselines_no_nb]
models = [
  "template_frequency_default",
  "markov_default",
]

[model_sets.deepcase_majority_vote]
models = ["deepcase"]

[model_sets.deepcase_majority_vote.overrides.deepcase]
"model.name" = "deepcase_majority_vote"
"model.cluster_score_strategy" = "majority_vote"

[model_sets.deepcase_threshold_fraction]
models = ["deepcase"]

[model_sets.deepcase_threshold_fraction.overrides.deepcase]
"model.name" = "deepcase_threshold_fraction"
"model.cluster_score_strategy" = "threshold_fraction"
"model.cluster_anomaly_fraction_threshold" = 0.75

[model_sets.deepcase_abstain_mixed]
models = ["deepcase"]

[model_sets.deepcase_abstain_mixed.overrides.deepcase]
"model.name" = "deepcase_abstain_mixed"
"model.cluster_score_strategy" = "abstain_mixed"

[experiments.bgl_entity_chronological]
dataset = "bgl/entity_chronological"
# Entity-chronological runs compare DeepCASE against the shared sanity
# baselines, keep the non-paper DeepLog extension inline, and add cluster
# labelling ablations only where BGL's event labels make them meaningful.
model_sets = [
  "baselines_with_nb",
  "deepcase_majority_vote",
  "deepcase_threshold_fraction",
  "deepcase_abstain_mixed",
]
models = [
  "deepcase",
  "deeplog_default",
]

[experiments.hdfs_v1_entity_chronological]
dataset = "hdfs/v1_entity_chronological"
# Entity-chronological runs compare DeepCASE against the shared sanity
# baselines and keep the non-paper DeepLog extension inline.
model_sets = ["baselines_with_nb"]
models = [
  "deepcase",
  "deeplog_default",
]

[experiments.openstack_deeplog_preprocessed]
dataset = "openstack/deeplog_preprocessed"
# OpenStack stays key-only because the current structured parser and Spell
# normalisation make paper-style parameter comparison unreliable. The run is
# still useful as a DeepLog-style comparison against the same file-boundary
# split, but it should not be read as a full parameter-anomaly reproduction.
model_sets = ["baselines_no_nb"]
models = [
  "deeplog_default",
  "deepcase",
]

[experiments.thunderbird]
dataset = "thunderbird"
# Thunderbird follows the benchmark slice used by the public LogLLM/DeepLog
# family: the canonical Thunderbird.log file, a 10-million-line range starting
# at line 160,000,000, and 100-log chronological windows. The DeepLog-style
# reproduction stays stream-shaped and keeps the simple baselines together.
model_sets = ["baselines_with_nb"]
models = ["deeplog_default"]

[experiments.thunderbird_entity_chronological]
dataset = "thunderbird/entity_chronological"
# DeepCASE needs entity-local sequences, so the Thunderbird extension is split
# out into its own entity-grouped experiment rather than sharing the
# chronological reproduction contract. The cluster-labelling ablations are
# kept here as a benchmark extension because Thunderbird labels are available
# at the alert level.
model_sets = [
  "baselines_with_nb",
  "deepcase_majority_vote",
  "deepcase_threshold_fraction",
  "deepcase_abstain_mixed",
]
models = [
  "deepcase",
  "deeplog_default",
]

[experiments.ait_ads]
dataset = "ait_ads/base"
# AIT-ADS is a single continuous alert chronology, so it keeps the
# stream-oriented baselines.
model_sets = ["baselines_no_nb"]
models = ["deeplog_default"]

[experiments.ait_ads_entity]
dataset = "ait_ads/entity_chronological"
# DeepCASE needs entity-local sequences, but the split still follows the
# global alert chronology before entity grouping so host context and
# time-ordering stay paper-faithful.
model_sets = ["baselines_no_nb"]
models = [
  "deeplog_default",
  "deepcase",
]

[experiment_sets.bgl_deeplog_paper]
# DeepLog paper reproduction: the LSTM next-event target plus the shared
# baselines that tell us whether the dataset is separable before the neural
# model does anything interesting. The baselines foreground event-level
# detection on BGL because the dataset labels individual log lines.
model_sets = ["baselines_no_nb"]
models = ["deeplog_default"]
datasets = [
  "bgl/deeplog_paper_1pct_normal_entry_stream_no_online",
  "bgl/deeplog_paper_10pct_entry_stream_no_online",
]

[experiment_sets.bgl_deeplog_paper.overrides.deeplog_default]
"model.history_size" = 3
"model.top_g_values" = [1, 3, 6]
"model.num_layers" = 1
"model.hidden_size" = 256
"model.primary_metric_scope" = "event_level_detection"
"model.secondary_metric_scopes" = ["next_event_prediction", "sequence_level_detection"]

[experiment_sets.hdfs_deeplog_paper]
# DeepLog paper reproduction: the HDFS runs that preserve the original
# normal-only training contract, plus the lightweight baselines that probe how
# much of the signal comes from template statistics or local ordering.
model_sets = ["baselines_no_nb"]
models = [
  "deeplog_default",
  "deepcase",
]
datasets = [
  "hdfs/v1_deeplog_paper_entry100k_split_partial",
  "hdfs/v1_deeplog_paper_entry100k_assign_first",
  "hdfs/wuyifan18_deeplog_preprocessed",
]

[experiment_sets.hdfs_deeplog_paper.overrides.deeplog_default]
"model.top_g_values" = [1, 3, 5, 7, 9]

[experiment_sets.hdfs_deepcase_table_iv_compat]
# DeepCASE Table-IV compatibility: the normal-only HDFS entity-local view
# sliced 20/80 by chronological raw-entry order, with next-event prediction
# as the headline metric. This is a compatibility view, not the DeepLog
# anomaly benchmark.
model_sets = ["baselines_no_nb"]
models = ["deepcase", "deeplog_default"]
datasets = ["hdfs/wuyifan18_deepcase_table_iv_compat"]

[experiment_sets.hdfs_deepcase_table_iv_compat.overrides.deepcase]
"model.primary_metric_scope" = "next_event_prediction"
