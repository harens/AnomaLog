name = "thunderbird_entity_chronological"
description = "Thunderbird entity-chronological extension for DeepCASE and shared baselines over the canonical Thunderbird.log slice."

[dataset]
name = "thunderbird_entity_chronological"
dataset_name = "THUNDERBIRD"
preset = "thunderbird"
template_parser = "drain3"
description = "Thunderbird entity-grouped extension over the 160,000,000-170,000,000 Thunderbird.log slice, used for DeepCASE-style entity-local runs."
evaluation_unit = "sequence"

[dataset.sequence]
grouping = "entity"
train_fraction = 0.2
test_fraction = 0.8
train_on_normal_entities_only = false

[dataset.cache_paths]
namespace = "thunderbird_entity"
