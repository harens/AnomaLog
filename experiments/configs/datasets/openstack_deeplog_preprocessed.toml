name = "openstack_deeplog_preprocessed"
description = "DeepLog OpenStack reproduction on LogHub OpenStack.tar.gz with Spell parsing, instance_id sessions, and file-boundary train/test splits. Rows without an instance id are dropped."

[dataset]
name = "openstack_deeplog_preprocessed"
dataset_name = "OPENSTACK_DEEPLOG_PREPROCESSED"
preset = "openstack_deeplog_preprocessed"
template_parser = "spell"
description = "DeepLog OpenStack reproduction config using Spell (tau=0.5), instance_id sessioning, and the normal1 / normal2 / abnormal file boundary. Rows without an instance id are dropped."

[dataset.sequence]
grouping = "entity"

[dataset.cache_paths]
data_root = "data/openstack_deeplog_preprocessed"
cache_root = ".cache/openstack_deeplog_preprocessed"

[[models]]
ref = "deeplog_default"
run_group = "deeplog"

[models.overrides]
"model.parameter_detection_enabled" = false

[[models]]
ref = "deepcase"
run_group = "deepcase"
