name = "hdfs_v1_deeplog_paper_entry100k_split_partial"
description = "DeepLog HDFS paper reproduction with split-partial straddler handling across the key-only and full variants, plus template-frequency and Markov sanity baselines on the same split."

[dataset]
name = "hdfs_v1_deeplog_paper_entry100k_split_partial"
dataset_name = "HDFS_V1"
preset = "hdfs_v1"
template_parser = "spell"
description = "DeepLog HDFS paper-reproduction config: first 100k raw entries, split before grouping, partial straddler handling, and normal-only entity training, shared by the key-only and full variants."

[dataset.sequence]
grouping = "entity"
train_fraction = 0.01
test_fraction = 0.99
train_on_normal_entities_only = true

[dataset.sequence.split]
mode = "raw_entry_prefix_count"
train_entry_count = 100000
application_order = "before_grouping"
straddling_group_policy = "split_partial_sequences"

[dataset.cache_paths]
data_root = "data/hdfs_entity"
cache_root = ".cache/hdfs_entity"

[[models]]
ref = "deeplog_default"
run_group = "deeplog"

[models.overrides]
# Paper default top-g for this HDFS benchmark is 9; we replay the curve up to
# that cut-off so the run summary still shows multiple thresholds.
"model.parameter_detection_enabled" = false

[[models]]
ref = "template_frequency_default"
run_group = "baselines"

[[models]]
ref = "markov_default"
run_group = "baselines"
