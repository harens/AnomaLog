name = "hdfs_v1_entity_chronological"
description = "HDFS v1 entity chronological experiment matrix with unsupervised, supervised, Markov, and label-aware sanity baselines."

[dataset]
name = "hdfs_v1_entity_chronological"
dataset_name = "HDFS_V1"
preset = "hdfs_v1"
template_parser = "drain3"
description = "Built-in HDFS_v1 preset grouped by entity with chronological prefix/suffix splitting."

[dataset.sequence]
grouping = "entity"
train_fraction = 0.2
train_on_normal_entities_only = false

[dataset.cache_paths]
data_root = "data/hdfs_entity"
cache_root = ".cache/hdfs_entity"

[[models]]
# Unsupervised sequence-level sanity baseline.
ref = "template_frequency_default"
run_group = "baselines"

[[models]]
# Supervised sequence-level sanity baseline.
ref = "naive_bayes_default"
run_group = "baselines"

[[models]]
# Normal-only sequence-order sanity baseline.
ref = "markov_default"
run_group = "baselines"

[[models]]
# Label-aware DeepCASE reproduction.
ref = "deepcase"
run_group = "deepcase"
