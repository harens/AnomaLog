name = "bgl_entity_normal_only"
dataset_name = "BGL"
preset = "bgl"
template_parser = "drain3"
description = "Built-in BGL preset grouped by entity with DeepLog-style normal-only training."

[sequence]
grouping = "entity"
train_fraction = 0.2
train_on_normal_entities_only = true

[cache_paths]
data_root = "data/bgl_entity"
cache_root = ".cache/bgl_entity"
