name = "bgl_how_far_are_we_2022"
description = "BGL How Far Are We? benchmark reproduction with one-hour time windows."

[dataset]
name = "bgl_how_far_are_we_2022"
dataset_name = "BGL"
preset = "bgl"
description = "How Far Are We? BGL benchmark reproduction using one-hour sliding time windows with a raw-entry split before grouping."
evaluation_unit = "window"
template_parser = "drain3"

[dataset.sequence]
grouping = "time"
time_span_ms = 3600000
step = 3600000
train_fraction = 0.8
test_fraction = 0.2

[dataset.sequence.split]
mode = "raw_entry_prefix_fraction"
application_order = "before_grouping"
straddling_group_policy = "drop_straddlers"
train_entry_fraction = 0.8

[dataset.cache_paths]
namespace = "bgl_time_window"
