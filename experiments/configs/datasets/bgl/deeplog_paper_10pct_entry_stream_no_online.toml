extends = "deeplog_paper_base.toml"
name = "bgl_deeplog_paper_10pct_entry_stream_no_online"
description = "DeepLog BGL paper reproduction for the 10% raw entry-stream setting without online update, plus a template-frequency sanity baseline on the same split."

[dataset]
name = "bgl_deeplog_paper_10pct_entry_stream_no_online"
description = "DeepLog BGL paper-reproduction config: first 10% of raw entries, chronological stream grouping, and no online update."

[dataset.sequence]
train_fraction = 0.1
test_fraction = 0.9

[dataset.sequence.split]
mode = "raw_entry_prefix_fraction"
train_entry_fraction = 0.1

[dataset.cache_paths]
namespace = "bgl_entity"
