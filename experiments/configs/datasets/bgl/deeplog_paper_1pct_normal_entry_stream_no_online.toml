extends = "deeplog_paper_base.toml"
name = "bgl_deeplog_paper_1pct_normal_entry_stream_no_online"
description = "DeepLog BGL paper reproduction for the 1% normal entry-stream setting without online update, plus a template-frequency sanity baseline on the same split."

[dataset]
name = "bgl_deeplog_paper_1pct_normal_entry_stream_no_online"
description = "DeepLog BGL paper-reproduction config: first 1% normal raw entries, chronological stream grouping, and no online update."

[dataset.sequence]
train_fraction = 0.01
test_fraction = 0.99

[dataset.sequence.split]
mode = "raw_entry_prefix_normal_fraction"
train_normal_entry_fraction = 0.01

[dataset.cache_paths]
namespace = "bgl_entity"
