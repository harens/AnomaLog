name = "openstack_deeplog_preprocessed"
description = "DeepLog OpenStack bounded experiment on LogHub OpenStack.tar.gz with identity template parsing over canonicalised message content, instance_id sessions prefixed by split name, file-boundary train/test splits, and template-frequency and Markov sanity baselines. Rows without an instance id are dropped."

[dataset]
name = "openstack_deeplog_preprocessed"
dataset_name = "OPENSTACK_DEEPLOG_PREPROCESSED"
preset = "openstack_deeplog_preprocessed"
template_parser = "identity"
description = "DeepLog OpenStack bounded config using identity template parsing over canonicalised raw content, split-prefixed instance_id sessioning, the normal1 / normal2 / abnormal file boundary, and template-frequency and Markov sanity baselines. Rows without an instance id are dropped."

[dataset.sequence]
grouping = "entity"

[dataset.cache_paths]
namespace = "openstack_deeplog_preprocessed"

[[models]]
ref = "deeplog_default"
run_group = "deeplog"

[[models]]
ref = "template_frequency_default"
run_group = "baselines"

[[models]]
ref = "markov_default"
run_group = "baselines"

[[models]]
ref = "deepcase"
run_group = "deepcase"
