name = "ait_ads_base"
description = "Shared AIT-ADS alert-stream dataset contract with canonical alert keys and chronological splitting."

[dataset]
template_parser = "identity"
description = "Shared AIT-ADS scenario contract using canonical alert keys with chronological raw-entry prefix splitting."
evaluation_unit = "continuous_event_stream"

[dataset.sequence]
grouping = "chronological_stream"
chunk_size = 100000
test_fraction = 0.8
train_fraction = 0.2

[dataset.sequence.split]
mode = "raw_entry_prefix_fraction"
application_order = "before_grouping"
straddling_group_policy = "split_partial_sequences"
train_entry_fraction = 0.2
