name = "bgl_deeplog_paper_10pct_entry_stream_no_online"
description = "DeepLog BGL paper reproduction for the 10% raw entry-stream setting without online update."

[dataset]
name = "bgl_deeplog_paper_10pct_entry_stream_no_online"
dataset_name = "BGL"
preset = "bgl"
template_parser = "drain3"
description = "DeepLog BGL paper-reproduction config: first 10% of raw entries, chronological stream grouping, and no online update."
evaluation_unit = "continuous_event_stream"

[dataset.sequence]
grouping = "chronological_stream"
chunk_size = 100000
train_fraction = 0.10
test_fraction = 0.90

[dataset.sequence.split]
mode = "raw_entry_prefix_fraction"
train_entry_fraction = 0.10
application_order = "before_grouping"
straddling_group_policy = "split_partial_sequences"

[dataset.cache_paths]
data_root = "data/bgl_entity"
cache_root = ".cache/bgl_entity"

[[models]]
ref = "deeplog_default"

[models.overrides]
"model.history_size" = 3
"model.top_g" = 6
"model.num_layers" = 1
"model.hidden_size" = 256
"model.primary_metric_scope" = "event_level_detection"
"model.secondary_metric_scopes" = ["next_event_prediction", "sequence_level_detection"]
