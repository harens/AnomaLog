name = "bgl_entity_chronological"
description = "BGL entity chronological experiment matrix with unsupervised, supervised, and label-aware sanity baselines."

[dataset]
name = "bgl_entity_chronological"
dataset_name = "BGL"
preset = "bgl"
template_parser = "drain3"
description = "Built-in BGL preset grouped by entity with chronological prefix/suffix splitting."

[dataset.sequence]
grouping = "entity"
train_fraction = 0.2
train_on_normal_entities_only = false

[dataset.cache_paths]
data_root = "data/bgl_entity"
cache_root = ".cache/bgl_entity"

[[models]]
# Unsupervised sequence-level sanity baseline.
ref = "template_frequency_default"
run_group = "baselines"

[[models]]
# Supervised sequence-level sanity baseline.
ref = "naive_bayes_default"
run_group = "baselines"

[[models]]
# Label-aware DeepCASE reproduction.
ref = "deepcase"
run_group = "deepcase"
