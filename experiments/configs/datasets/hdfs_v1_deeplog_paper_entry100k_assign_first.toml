name = "hdfs_v1_deeplog_paper_entry100k_assign_first"
description = "DeepLog HDFS paper reproduction with assign-by-first-event straddler handling across the key-only and full variants, plus a template-frequency sanity baseline on the same split."

[dataset]
name = "hdfs_v1_deeplog_paper_entry100k_assign_first"
dataset_name = "HDFS_V1"
preset = "hdfs_v1"
template_parser = "spell"
description = "DeepLog HDFS paper-reproduction ablation: first 100k raw entries with assign-by-first-event straddler handling and normal-only entity training, shared by the key-only and full variants."

[dataset.sequence]
grouping = "entity"
train_fraction = 0.01
test_fraction = 0.99
train_on_normal_entities_only = true

[dataset.sequence.split]
mode = "raw_entry_prefix_count"
train_entry_count = 100000
application_order = "before_grouping"
straddling_group_policy = "assign_by_first_event"

[dataset.cache_paths]
data_root = "data/hdfs_entity"
cache_root = ".cache/hdfs_entity"

[[models]]
ref = "deeplog_default"
run_group = "deeplog"

[models.overrides]
"model.parameter_detection_enabled" = false

[[models]]
ref = "template_frequency_default"
run_group = "baselines"
