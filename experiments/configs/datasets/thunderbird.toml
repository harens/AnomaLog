name = "thunderbird"
description = "Thunderbird Loghub reproduction on the canonical Thunderbird.log slice used by the benchmark code, with 100-log chronological windows."

[dataset]
name = "thunderbird"
dataset_name = "THUNDERBIRD"
preset = "thunderbird"
template_parser = "drain3"
description = "Thunderbird reproduction on the 160,000,000-170,000,000 raw Thunderbird.log line slice, using 100-log chronological windows."
evaluation_unit = "sequence"

[dataset.sequence]
grouping = "fixed"
window_size = 100
step = 100
window_basis = "raw_positions"
window_alignment_offset = 0
train_fraction = 0.8
test_fraction = 0.2

[dataset.cache_paths]
namespace = "thunderbird"
