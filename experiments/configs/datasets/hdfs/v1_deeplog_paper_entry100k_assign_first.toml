extends = "v1_deeplog_paper_base.toml"
name = "hdfs_v1_deeplog_paper_entry100k_assign_first"
description = "DeepLog HDFS paper reproduction with assign-by-first-event straddler handling across the key-only and full variants, plus template-frequency and Markov sanity baselines on the same split."

[dataset]
name = "hdfs_v1_deeplog_paper_entry100k_assign_first"
description = "DeepLog HDFS paper-reproduction ablation: first 100k raw entries with assign-by-first-event straddler handling and normal-only entity training, shared by the key-only and full variants."

[dataset.sequence.split]
mode = "raw_entry_prefix_count"
train_entry_count = 100000
straddling_group_policy = "assign_by_first_event"

[dataset.cache_paths]
namespace = "hdfs_entity"
